# Pre-commit hooks configuration for OAuth Token CLI
# This ensures all code is properly formatted and linted before committing
repos:
  # Step 1: Format and fix all files
  - repo: local
    hooks:
      - id: treefmt
        name: Format all files with treefmt
        entry: nix
        args: [develop, --command, treefmt]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: "Format all project files using treefmt (Biome, Alejandra, yamlfmt, etc.)"
      - id: biome-lint-fix
        name: Lint and fix TypeScript/JavaScript with Biome
        entry: nix
        args: [develop, --command, bun, run, 'lint:fix']
        language: system
        files: \.(ts|js|tsx|jsx|json)$
        pass_filenames: false
        stages: [pre-commit]
        description: "Lint and auto-fix TypeScript/JavaScript files with Biome"
      - id: deadnix
        name: Remove dead Nix code
        entry: nix
        args: [develop, --command, deadnix, --edit, --no-lambda-arg, --no-lambda-pattern-names]
        language: system
        files: \.nix$
        stages: [pre-commit]
        description: "Remove dead code from Nix files"
      - id: statix
        name: Nix static analysis and fixes
        entry: nix
        args: [develop, --command, statix, fix]
        language: system
        files: \.nix$
        stages: [pre-commit]
        description: "Run static analysis and fixes on Nix files"
  # Step 2: Stage all modified files
  - repo: local
    hooks:
      - id: git-add-formatted
        name: Stage formatted and fixed files
        entry: bash
        args: [-c, 'git add -A']
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: "Stage all files that were modified by formatters and linters"
  # Step 3: Final validation (must pass or commit fails)
  - repo: local
    hooks:
      - id: treefmt-check
        name: Verify formatting is applied
        entry: nix
        args: [develop, --command, treefmt, --fail-on-change]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: "Verify all files are properly formatted (final check)"
      - id: biome-check
        name: Verify linting is clean
        entry: nix
        args: [develop, --command, bun, run, lint]
        language: system
        files: \.(ts|js|tsx|jsx|json)$
        pass_filenames: false
        stages: [pre-commit]
        description: "Verify all TypeScript/JavaScript files pass linting (final check)"
# Global configuration
default_stages: [pre-commit]
fail_fast: true
