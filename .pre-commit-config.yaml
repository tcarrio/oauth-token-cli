# Pre-commit hooks configuration for OAuth Token CLI
# This ensures all code is properly formatted and linted before committing
repos:
  # Auto-format and fix hooks that modify files
  - repo: local
    hooks:
      - id: auto-format-and-commit
        name: Auto-format and stage files
        entry: bash
        args: [-c, ' echo "🔧 Formatting and fixing all files..."; nix develop --command treefmt || exit 1; nix develop --command bun run lint:fix || exit 1; if [ -n "$(git diff --name-only)" ]; then echo "📝 Staging formatted files..."; git add -A; echo "✅ Files formatted and staged. Proceeding with commit..."; else echo "✅ No formatting changes needed."; fi ']
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true
        description: "Auto-format, fix, and stage all modified files"
  # Validation hooks that must pass for commit to succeed
  - repo: local
    hooks:
      - id: validate-formatting
        name: Validate all files are properly formatted
        entry: nix
        args: [develop, --command, treefmt, --fail-on-change]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: "Ensure all files are properly formatted"
      - id: validate-linting
        name: Validate TypeScript/JavaScript linting
        entry: nix
        args: [develop, --command, bun, run, lint]
        language: system
        files: \.(ts|js|tsx|jsx|json)$
        pass_filenames: false
        stages: [pre-commit]
        description: "Ensure all TypeScript/JavaScript files pass linting"
      - id: validate-nix-files
        name: Validate Nix files
        entry: bash
        args:
          - -c
          - >-
            echo "🔍 Checking Nix files..."; nix develop --command deadnix --no-lambda-arg --no-lambda-pattern-names .; nix develop --command statix check .
        language: system
        files: \.nix$
        pass_filenames: false
        stages: [pre-commit]
        description: "Validate Nix files are clean"
# Global configuration
default_stages: [pre-commit]
fail_fast: false
