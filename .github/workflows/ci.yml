name: CI ✅
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  # Comprehensive CI check using Nix flake
  ci-check:
    name: Comprehensive CI Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Run comprehensive CI checks
        run: nix run .#ci-check
  # Individual checks for better visibility
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Check dependencies
        run: nix run .#ci-install
      - name: Check formatting
        run: nix run .#ci-format
      - name: Run linting
        run: nix run .#ci-lint
  # Flake validation
  flake-check:
    name: Flake Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: DeterminateSystems/flake-checker-action@v12
      - name: Nix flake check
        run: nix flake check
  # Build and functionality test
  build-test:
    name: Build and Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build CLI
        run: nix run .#ci-build
      - name: Test CLI functionality
        run: nix run .#ci-test
      - name: Test compiled binary
        run: |
          # Build the actual binary
          nix build .#oauth-token-cli
          # Test the compiled binary works
          ./result/bin/oauth-token-cli --help
