name: CI ✅
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Install dependencies
        run: bun install
      - name: Check formatting
        run: bun run format
      - name: Run linting
        run: bun run lint
  flake-check:
    name: Flake Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: DeterminateSystems/flake-checker-action@v12
  build-test:
    name: Build and Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        run: bun run oauth --help
      - name: Test CLI functionality
        run: |-
          # Test help command works
          bun run oauth --help
          # Test config validation (should fail gracefully)
          bun run oauth || true
